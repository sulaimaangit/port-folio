<header class="topbar" (keydown.escape)="closeMenu()">
  <a class="wordmark" routerLink="/" aria-label="Muhammad Sulaimaan, home">MS<span>.</span></a>
  <button
    class="menu-toggle"
    type="button"
    aria-controls="primary-navigation"
    [attr.aria-expanded]="isMenuOpen"
    [attr.aria-label]="isMenuOpen ? 'Close navigation menu' : 'Open navigation menu'"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav id="primary-navigation" aria-label="Main navigation" [class.is-open]="isMenuOpen">
    <!-- <a class="home-link" routerLink="/" routerLinkActive="current-route" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a> -->
    <a routerLink="/journey" (click)="closeMenu()">Journey</a>
    <a routerLink="/work" (click)="closeMenu()">Work</a>
    <a routerLink="/about" (click)="closeMenu()">Overview</a>
    <a routerLink="/connect" (click)="closeMenu()">Connect!</a>
  </nav>
</header>
