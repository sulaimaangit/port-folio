<section class="journey-section section-wrap">
  <div class="journey-heading">
    <div>
      <h1>Learning, building,<br><span>moving forward.</span></h1>
    </div>
  </div>
  <div class="timeline" aria-label="Education and experience timeline">
    @for (entry of entries; track entry.id) {
      <article class="timeline-entry">
        <div class="timeline-row">
          <span class="timeline-date">{{ entry.date }}</span>
          <span class="timeline-marker" aria-hidden="true"></span>
          <span class="timeline-content">
            <span class="timeline-title">{{ entry.title }}</span>
            <span class="timeline-summary">{{ entry.summary }}</span>
          </span>
        </div>
        <div class="timeline-details">
          <ul>
            @for (detail of entry.details; track detail) {
              <li>{{ detail }}</li>
            }
          </ul>
        </div>
      </article>
    }
  </div>
</section>
