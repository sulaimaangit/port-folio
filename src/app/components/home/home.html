<section class="hero section-wrap">
  <div class="hero-copy">
    <p class="eyebrow"><span class="eyebrow-line"></span> PORTFOLIO </p>
    <h1>Building useful<br><span>software, end to end.</span></h1>
    <p class="intro">Hi, I’m  <strong>Sulaimaan</strong> — a Java Full Stack Developer building scalable services with Spring Boot and responsive applications with Angular.</p>
    <div class="hero-actions">
      <a class="hero-action-link" routerLink="/about">A little about me <span>↗</span></a>
      <a class="hero-action-link" routerLink="/journey">My Journey <span>↗</span></a>
      <a class="hero-action-link" routerLink="/work">Explore My Work <span>↗</span></a>
    </div>
  </div>
  <div
    class="hero-art"
    role="img"
    aria-label="Four electrons orbiting an atomic nucleus in three dimensions"
    [class.is-dragging]="isDraggingAtom"
    (pointerdown)="startAtomDrag($event)"
    (pointermove)="moveAtom($event)"
    (pointerup)="endAtomDrag($event)"
    (pointercancel)="cancelAtomDrag($event)"
  >
    <div class="art-label" aria-hidden="true">IDEAS INTO<br>REALITY</div>
    <div class="atom" aria-hidden="true">
      <div class="orbit orbit-one">
        <div class="orbit-rotator"><span class="electron"></span></div>
      </div>
      <div class="orbit orbit-two">
        <div class="orbit-rotator"><span class="electron"></span></div>
      </div>
      <div class="orbit orbit-three">
        <div class="orbit-rotator"><span class="electron"></span></div>
      </div>
      <div class="orbit orbit-four">
        <div class="orbit-rotator"><span class="electron"></span></div>
      </div>
      <div class="nucleus"></div>
    </div>
  </div>
  <div class="hero-foot"><span>BASED IN CHENNAI, INDIA</span></div>
</section>
